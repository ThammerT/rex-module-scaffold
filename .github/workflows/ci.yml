name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装测试依赖
        run: npm install --ignore-scripts

      - name: 离线回归
        run: npm test

      - name: 元数据校验
        run: node validators/metadata.js modules/yuanqi-wallpaper/yuanqi-wallpaper.js

      - name: 收集可导入模块
        uses: actions/upload-artifact@v4
        with:
          name: yuanqi-wallpaper
          path: modules/yuanqi-wallpaper/yuanqi-wallpaper.js
